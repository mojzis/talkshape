<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">

  <!-- Back wheel -->
  <circle cx="80" cy="280" r="50" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="80" cy="280" r="5" fill="#333"/>
  <!-- Back wheel spokes -->
  <line x1="80" y1="230" x2="80" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="30" y1="280" x2="130" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="45" y1="245" x2="115" y2="315" stroke="#333" stroke-width="1.5"/>
  <line x1="115" y1="245" x2="45" y2="315" stroke="#333" stroke-width="1.5"/>

  <!-- Front wheel -->
  <circle cx="300" cy="280" r="50" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="300" cy="280" r="5" fill="#333"/>
  <!-- Front wheel spokes -->
  <line x1="300" y1="230" x2="300" y2="330" stroke="#333" stroke-width="1.5"/>
  <line x1="250" y1="280" x2="350" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="265" y1="245" x2="335" y2="315" stroke="#333" stroke-width="1.5"/>
  <line x1="335" y1="245" x2="265" y2="315" stroke="#333" stroke-width="1.5"/>

  <!-- Bike frame -->
  <line x1="80" y1="280" x2="150" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="150" y1="200" x2="80" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="80" y1="200" x2="80" y2="280" stroke="#333" stroke-width="3"/>
  <line x1="150" y1="200" x2="220" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="220" y1="200" x2="300" y2="280" stroke="#333" stroke-width="3"/>
  <line x1="220" y1="200" x2="220" y2="160" stroke="#333" stroke-width="3"/>
  <!-- Handlebars -->
  <line x1="200" y1="155" x2="240" y2="155" stroke="#333" stroke-width="3"/>
  <line x1="220" y1="160" x2="220" y2="155" stroke="#333" stroke-width="2"/>

  <!-- Seat -->
  <line x1="150" y1="200" x2="150" y2="175" stroke="#333" stroke-width="3"/>
  <ellipse cx="150" cy="170" rx="18" ry="6" fill="#333"/>

  <!-- Pedals and crank -->
  <circle cx="150" cy="230" r="12" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="230" x2="135" y2="250" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="230" x2="165" y2="210" stroke="#333" stroke-width="2"/>
  <rect x="128" y="248" width="14" height="5" fill="#333"/>
  <rect x="158" y="207" width="14" height="5" fill="#333"/>

  <!-- Chain -->
  <line x1="80" y1="280" x2="150" y2="230" stroke="#333" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Pelican body -->
  <ellipse cx="150" cy="120" rx="45" ry="35" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican neck -->
  <path d="M 175 100 C 200 80, 220 60, 230 50" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 180 115 C 205 100, 225 75, 235 60" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican head -->
  <ellipse cx="240" cy="45" rx="20" ry="15" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican eye -->
  <circle cx="245" cy="40" r="4" fill="#333"/>
  <circle cx="246" cy="39" r="1.5" fill="white"/>

  <!-- Pelican beak - upper -->
  <path d="M 258 42 L 310 48 L 305 52 L 258 48" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican beak - lower with pouch -->
  <path d="M 258 48 C 270 55, 280 70, 275 80 C 268 90, 255 85, 250 75 C 248 68, 252 55, 258 48"
        fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican wing -->
  <path d="M 120 110 C 100 100, 85 115, 95 135 C 105 150, 130 145, 140 130"
        fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 95 135 C 85 130, 75 140, 85 150" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 105 140 C 95 138, 88 148, 95 155" fill="none" stroke="#333" stroke-width="1.5"/>
  <path d="M 115 142 C 108 142, 102 152, 108 158" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Pelican tail feathers -->
  <path d="M 105 130 C 80 135, 65 125, 60 115" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 105 135 C 82 142, 68 135, 62 125" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 108 140 C 88 150, 72 145, 68 135" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican legs -->
  <path d="M 135 150 L 125 185 L 135 250" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 160 150 L 170 185 L 165 210" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican feet on pedals -->
  <path d="M 130 248 L 120 255 M 135 250 L 135 258 M 140 248 L 148 254" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 160 207 L 155 200 M 165 205 L 165 198 M 172 207 L 178 202" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Pelican wing holding handlebar -->
  <path d="M 180 120 C 195 130, 200 145, 200 155" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 200 155 C 195 158, 198 162, 205 160" fill="none" stroke="#333" stroke-width="1.5"/>

</svg>
